<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGENDARY SUPER LEAGUE SEASON 10</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000000;
      color: #FFD700;
      padding: 20px;
      min-height: 100vh;
    }

    /* ================= FENÊTRE D'ACCUEIL ================= */
    .welcome-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
    }

    .welcome-box {
      background-color: #0a0a0a;
      border: 4px solid #FFD700;
      border-radius: 30px;
      padding: 70px 60px;
      max-width: 1100px;
      width: 100%;
      text-align: center;
    }

    .welcome-box h1 {
      font-size: 3.2rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #FFD700;
      margin-bottom: 20px;
      font-weight: 800;
    }

    .welcome-box h1 i {
      font-size: 3rem;
      margin-right: 15px;
    }

    .welcome-box p {
      color: #ccc;
      font-size: 1.4rem;
      margin-bottom: 50px;
      letter-spacing: 1px;
    }

    .choice-buttons {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .choice-btn {
      flex: 1;
      min-width: 300px;
      background-color: #111;
      border: 3px solid #FFD700;
      border-radius: 25px;
      padding: 50px 30px;
      color: #FFD700;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .choice-btn i {
      display: block;
      font-size: 4rem;
      margin-bottom: 20px;
      color: #FFD700;
    }

    .choice-btn:hover {
      background-color: #FFD700;
      color: #000;
    }

    .choice-btn:hover i {
      color: #000;
    }

    /* ================= SITE PRINCIPAL ================= */
    .site-content {
      display: none;
    }

    .site-content.active {
      display: block;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 35px;
      background-color: #111;
      border-bottom: 4px solid #FFD700;
      border-radius: 15px 15px 0 0;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .logo-title {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo-title i {
      font-size: 3rem;
      color: #FFD700;
    }

    .logo-title h1 {
      font-size: 2.4rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 800;
      color: #FFD700;
    }

    .ffleg-badge {
      background: #1a1a1a;
      border: 3px solid #FFD700;
      border-radius: 40px;
      padding: 14px 32px;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: #FFD700;
    }

    /* LAYOUT PRINCIPAL */
    .main-container {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
    }

    .left-column {
      flex: 2;
      min-width: 600px;
    }

    .right-column {
      flex: 1;
      min-width: 320px;
    }

    /* CARTES */
    .card {
      background-color: #0a0a0a;
      border: 3px solid #FFD700;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #FFD700;
      padding-bottom: 15px;
      margin-bottom: 20px;
      font-size: 1.6rem;
      font-weight: bold;
      color: #FFD700;
    }

    .card-header-left {
      display: flex;
      align-items: center;
    }

    .card-header i {
      font-size: 1.8rem;
      margin-right: 12px;
    }

    .card-header .download-btn {
      background: #FFD700;
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-header .download-btn:hover {
      background: #fff;
      transform: scale(1.05);
    }

    /* TABLEAUX */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1.05rem;
    }

    th {
      background-color: #1a1a1a;
      color: #FFD700;
      padding: 18px 20px;
      text-align: center;
      border-bottom: 2px solid #FFD70055;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.95rem;
    }

    th:first-child,
    td:first-child {
      text-align: center;
      width: 70px;
    }

    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    th:nth-child(3),
    td:nth-child(3),
    th:nth-child(4),
    td:nth-child(4),
    th:nth-child(5),
    td:nth-child(5),
    th:nth-child(6),
    td:nth-child(6) {
      text-align: center;
    }

    td {
      padding: 16px 20px;
      border-bottom: 1px solid #222;
      color: #eee;
    }

    tr:hover {
      background-color: #1a1a1a;
    }

    /* LOGO D'ÉQUIPE */
    .team-logo-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 12px;
      border: 2px solid #FFD700;
      background: #FFD700;
      vertical-align: middle;
    }

    .team-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #FFD700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 0.85rem;
      margin-right: 12px;
      border: 3px solid #FFD700;
      text-transform: uppercase;
    }

    .player-photo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #333;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #FFD700;
      font-weight: bold;
      font-size: 1rem;
      margin-right: 12px;
      border: 3px solid #FFD700;
      object-fit: cover;
    }

    /* BADGES */
    .badge-booyah {
      background-color: #FFD700;
      color: #000;
      font-weight: bold;
      padding: 6px 18px;
      border-radius: 25px;
      font-size: 0.95rem;
      display: inline-block;
      min-width: 40px;
      text-align: center;
    }

    .badge-kill {
      background-color: #1a1a1a;
      border: 2px solid #FFD700;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: bold;
      color: #FFD700;
      display: inline-block;
      min-width: 40px;
      text-align: center;
    }

    /* ========== SÉLECTEUR DE SEMAINE ========== */
    .week-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .week-btn {
      background-color: #111;
      border: 3px solid #FFD700;
      border-radius: 15px;
      padding: 12px 25px;
      color: #FFD700;
      font-weight: bold;
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
      text-transform: uppercase;
    }

    .week-btn:hover {
      background-color: #FFD700;
      color: #000;
    }

    .week-btn.active {
      background-color: #FFD700;
      color: #000;
    }

    .week-btn.total-btn {
      background-color: #FFD700;
      color: #000;
      border-color: #FFD700;
    }

    /* ========== SÉLECTEUR DE JOUR ========== */
    .day-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .day-btn {
      background-color: #111;
      border: 3px solid #FFD700;
      border-radius: 15px;
      padding: 10px 20px;
      color: #FFD700;
      font-weight: bold;
      font-size: 0.95rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
      text-transform: uppercase;
    }

    .day-btn:hover {
      background-color: #FFD700;
      color: #000;
    }

    .day-btn.active {
      background-color: #FFD700;
      color: #000;
    }

    /* ========== AFFICHAGE DU JOUR ========== */
    .day-display {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 15px;
    }

    .day-item {
      background: #111;
      border: 3px solid #FFD700;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      font-weight: bold;
      color: #FFD700;
    }

    .day-item i {
      display: block;
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .day-item .day-label {
      font-size: 1.8rem;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .day-item .day-match {
      font-size: 2rem;
      color: #fff;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .day-item .day-teams-count {
      font-size: 1.1rem;
      color: #FFD700;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    .day-item .day-desc {
      font-size: 1rem;
      color: #FFD700;
      margin-top: 12px;
      letter-spacing: 1px;
      font-weight: normal;
    }

    .day-item.special {
      background: #FFD700;
      color: #000;
    }

    .day-item.special .day-match,
    .day-item.special .day-teams-count,
    .day-item.special .day-desc {
      color: #000;
    }

    .day-item.rush {
      border-color: #fff;
      background: #1a1a1a;
      color: #fff;
    }

    .day-item.rush i {
      color: #fff;
    }

    .day-item.rush .day-match {
      color: #fff;
    }

    .day-item.rush .day-desc {
      color: #ccc;
    }

    /* ========== TABLEAU DES ÉQUIPES DU JOUR ========== */
    .day-teams-table {
      margin-top: 20px;
      background: #0d0d0d;
      border: 3px solid #FFD700;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
    }

    .day-teams-table .table-title {
      background: #1a1a1a;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #FFD700;
      letter-spacing: 1px;
      border-bottom: 2px solid #FFD700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-teams-table .table-title .title-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .day-teams-table .table-title .download-btn-small {
      background: #FFD700;
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: bold;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .day-teams-table .table-title .download-btn-small:hover {
      background: #fff;
    }

    .day-teams-table table {
      font-size: 0.95rem;
    }

    .day-teams-table th {
      padding: 14px 18px;
      font-size: 0.85rem;
    }

    .day-teams-table td {
      padding: 12px 18px;
    }

    /* STATS JOUEURS */
    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 2px solid #222;
      font-size: 1.1rem;
    }

    .stat-item .label {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .stat-item .value {
      font-weight: bold;
      color: #FFD700;
      font-size: 1.1rem;
    }

    /* BOUTON RETOUR */
    .back-btn {
      background-color: #111;
      border: 3px solid #FFD700;
      border-radius: 15px;
      padding: 14px 30px;
      color: #FFD700;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      transition: 0.2s;
    }

    .back-btn:hover {
      background-color: #FFD700;
      color: #000;
    }

    /* ========== BOUTON UPLOAD CSV ========== */
    .upload-zone {
      background: #1a1a1a;
      border: 3px dashed #FFD700;
      border-radius: 15px;
      padding: 20px 30px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .upload-zone .upload-info {
      display: flex;
      align-items: center;
      gap: 15px;
      flex: 1;
      min-width: 200px;
    }

    .upload-zone .upload-info i {
      font-size: 2rem;
      color: #FFD700;
    }

    .upload-zone .upload-info .upload-text {
      display: flex;
      flex-direction: column;
    }

    .upload-zone .upload-info .upload-text strong {
      color: #FFD700;
      font-size: 1.1rem;
    }

    .upload-zone .upload-info .upload-text span {
      color: #888;
      font-size: 0.85rem;
    }

    .upload-btn {
      background-color: #FFD700;
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 14px 30px;
      font-weight: bold;
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .upload-btn:hover {
      background-color: #fff;
    }

    .upload-btn input[type="file"] {
      display: none;
    }

    .upload-status {
      width: 100%;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .upload-status.success {
      background: #0a2a0a;
      border: 2px solid #0f0;
      color: #0f0;
    }

    .upload-status.error {
      background: #2a0a0a;
      border: 2px solid #f00;
      color: #f00;
    }

    /* NOTIFICATION TOAST */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #FFD700;
      color: #000;
      padding: 18px 30px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
      z-index: 10000;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast i {
      font-size: 1.4rem;
    }

    /* RESPONSIVE */
    @media (max-width: 1200px) {
      .main-container { flex-direction: column; }
      .left-column, .right-column { min-width: 100%; }
      .header { flex-direction: column; text-align: center; }
      .welcome-box h1 { font-size: 2.2rem; }
      .choice-btn { min-width: 220px; padding: 35px 20px; font-size: 1.2rem; }
      .choice-btn i { font-size: 3rem; }
      .welcome-box { padding: 50px 30px; }
    }
  </style>
</head>
<body>

  <!-- ================= FENÊTRE D'ACCUEIL ================= -->
  <div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-box">
      <h1><i class="fas fa-crown"></i> LEGENDARY SUPER LEAGUE S10</h1>
      <p>Choisissez ce que vous voulez afficher dans la colonne de droite :</p>
      <div class="choice-buttons">
        <button class="choice-btn" onclick="selectChoice('day')">
          <i class="fas fa-calendar-day"></i>
          POINTS OF EACH DAY
        </button>
        <button class="choice-btn" onclick="selectChoice('stats')">
          <i class="fas fa-chart-bar"></i>
          STATISTIQUE PLAYERS
        </button>
      </div>
    </div>
  </div>

  <!-- ================= SITE PRINCIPAL ================= -->
  <div class="site-content" id="siteContent">

    <!-- HEADER -->
    <header class="header">
      <div class="logo-title">
        <i class="fas fa-crown"></i>
        <h1>LEGENDARY SUPER LEAGUE <span style="color:#fff;">S10</span></h1>
      </div>
      <div class="ffleg-badge">
        <i class="fas fa-shield-alt"></i> FFLEG-SLS10 - TOTAL DAYS 18 WITH FINAL
      </div>
    </header>

    <!-- BOUTON RETOUR -->
    <button class="back-btn" onclick="goBack()">
      <i class="fas fa-arrow-left"></i> Retour au choix
    </button>

    <!-- CONTENU PRINCIPAL -->
    <div class="main-container">

      <!-- COLONNE GAUCHE -->
      <div class="left-column">

        <!-- POINTS OF 19 TEAMS -->
        <div class="card" id="globalCard">
          <div class="card-header">
            <div class="card-header-left">
              <i class="fas fa-trophy"></i>
              <span>POINTS OF 19 TEAMS</span>
            </div>
            <button class="download-btn" onclick="downloadImage('globalCard', 'SLS10-Classement-Global')">
              <i class="fas fa-download"></i> Télécharger
            </button>
          </div>
          <div style="overflow-x: auto;">
            <table>
              <thead>
                <tr>
                  <th>Rang</th>
                  <th>Équipe</th>
                  <th>Kills</th>
                  <th>Top</th>
                  <th>Total</th>
                  <th>Booyah</th>
                </tr>
              </thead>
              <tbody id="teamsTable"></tbody>
            </table>
          </div>
        </div>

        <!-- MVP PLAYERS -->
        <div class="card" id="mvpCard">
          <div class="card-header">
            <div class="card-header-left">
              <i class="fas fa-star"></i>
              <span>MVP PLAYERS CLASSMENT</span>
            </div>
            <button class="download-btn" onclick="downloadImage('mvpCard', 'SLS10-MVP-Players')">
              <i class="fas fa-download"></i> Télécharger
            </button>
          </div>
          <div style="overflow-x: auto;">
            <table>
              <thead>
                <tr>
                  <th>Rang</th>
                  <th>Joueur</th>
                  <th>Kill</th>
                  <th>Assist</th>
                </tr>
              </thead>
              <tbody id="mvpTable"></tbody>
            </table>
          </div>
        </div>

      </div>

      <!-- COLONNE DROITE DYNAMIQUE -->
      <div class="right-column" id="rightColumn"></div>

    </div>
  </div>

  <!-- TOAST DE NOTIFICATION -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage">Image téléchargée !</span>
  </div>

  <!-- ================= SCRIPT ================= -->
  <script>
    // ========== LOGOS DES ÉQUIPES ==========
    const teamLogos = {
      "69 E-SPORT": "6E.png",
      "AL AHLI ESP": "AA.png",
      "AMATERAS": "AM.png",
      "ALPHA TEAM": "AT.png",
      "BAZ ESPORT": "BE.png",
      "CLEAR VISION": "CV.png",
      "FENNEC ESPORT": "FE.png",
      "FURY ESPORTS": "FURY.png",
      "GOATVERSE": "GO.png",
      "IMPELDOWN": "IM.png",
      "JOKO FORCE": "JF.png",
      "NEYA ESPORT": "NEYA.png",
      "STARS DZ": "SD.png",
      "SUPER STARS": "SS.png",
      "VOLCANOS": "VO.png",
      "WANTED DZ": "WD.png",
      "WINNERS": "WI.png",
      "XPROJEKT ESP": "XE.png",
      "NEXORA": "902000052.png"
    };

    const groups = {
      A: ["FENNEC ESPORT","IMPELDOWN","NEYA ESPORT","STARS DZ","VOLCANOS","XPROJEKT ESP"],
      B: ["69 E-SPORT","AL AHLI ESP","AMATERAS","BAZ ESPORT","GOATVERSE","WANTED DZ","WINNERS"],
      C: ["CLEAR VISION","JOKO FORCE","ALPHA TEAM","SUPER STARS","FURY ESPORTS","NEXORA"]
    };

    const teamNames = [...groups.A, ...groups.B, ...groups.C];

    const teamStats = {};
    teamNames.forEach(name => {
      teamStats[name] = { kills: 0, top: 0, total: 0, booyah: 0 };
    });

    let mvpPlayers = [];
    let playerStats = [];

    // ========== 🧠 DÉTECTION INTELLIGENTE ==========
    function similarity(a, b) {
      const longer = a.length > b.length ? a : b;
      const shorter = a.length > b.length ? b : a;
      if (longer.length === 0) return 1.0;
      const distance = levenshteinDistance(longer, shorter);
      return (longer.length - distance) / longer.length;
    }

    function levenshteinDistance(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(matrix[i-1][j-1] + 1, matrix[i][j-1] + 1, matrix[i-1][j] + 1);
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function findBestMatch(csvName) {
      const cleaned = csvName.trim().toUpperCase().replace(/[ÉÈÊË]/g, 'E').replace(/[ÀÂÄ]/g, 'A');
      for (const officialName of teamNames) {
        const officialCleaned = officialName.toUpperCase().replace(/[ÉÈÊË]/g, 'E').replace(/[ÀÂÄ]/g, 'A');
        if (officialCleaned === cleaned) return officialName;
      }
      let bestMatch = null, bestScore = 0.65;
      for (const officialName of teamNames) {
        const officialCleaned = officialName.toUpperCase().replace(/[ÉÈÊË]/g, 'E').replace(/[ÀÂÄ]/g, 'A');
        const score = similarity(cleaned, officialCleaned);
        if (score > bestScore) { bestScore = score; bestMatch = officialName; }
      }
      return bestMatch;
    }

    function getTeamLogoHTML(name) {
      const logoFile = teamLogos[name];
      if (logoFile) {
        return `<img src="${logoFile}" alt="${name}" class="team-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';">
                <span class="team-logo" style="display:none;">${getInitials(name)}</span>`;
      }
      return `<span class="team-logo">${getInitials(name)}</span>`;
    }

    function getInitials(name) {
      const words = name.split(/[\s\-]+/).filter(w => w.length > 0);
      if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    // ========== 📸 TÉLÉCHARGEMENT D'IMAGE ==========
    function downloadImage(elementId, fileName) {
      const element = document.getElementById(elementId);
      if (!element) return;

      // Masquer temporairement les boutons de téléchargement
      const buttons = element.querySelectorAll('.download-btn, .download-btn-small');
      buttons.forEach(btn => btn.style.visibility = 'hidden');

      // Afficher le toast "génération en cours"
      showToast('Génération de l\'image en cours...', 'fa-spinner fa-spin');

      html2canvas(element, {
        backgroundColor: '#000000',
        scale: 3, // Haute qualité (3x)
        useCORS: true,
        allowTaint: true,
        logging: false,
        onclone: (clonedDoc) => {
          // S'assurer que le fond noir est bien appliqué
          const clonedElement = clonedDoc.getElementById(elementId);
          if (clonedElement) {
            clonedElement.style.backgroundColor = '#000000';
          }
        }
      }).then(canvas => {
        // Remettre les boutons visibles
        buttons.forEach(btn => btn.style.visibility = 'visible');

        // Créer le lien de téléchargement
        const link = document.createElement('a');
        link.download = `${fileName}-${new Date().toISOString().slice(0,10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();

        showToast('Image téléchargée !', 'fa-check-circle');
      }).catch(err => {
        buttons.forEach(btn => btn.style.visibility = 'visible');
        console.error('Erreur:', err);
        showToast('Erreur lors du téléchargement', 'fa-exclamation-triangle');
      });
    }

    function showToast(message, icon) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');
      toast.querySelector('i').className = `fas ${icon}`;
      toastMessage.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ========== 📂 CHARGEMENT CSV ==========
    function handleFileUpload(event, dayId) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const csvText = e.target.result;
        
        resetStats();
        parseCSV(csvText);

        const statusEl = document.getElementById('uploadStatus');
        if (statusEl) {
          statusEl.className = 'upload-status success';
          statusEl.style.display = 'flex';
          statusEl.innerHTML = `<i class="fas fa-check-circle"></i> ${file.name} chargé — ${teamNames.filter(n => teamStats[n].total > 0).length} équipes mises à jour`;
        }

        renderGlobalTeamsTable();
        renderMVPTable();
        if (currentView === 'day') renderDaySection();
        else if (currentView === 'stats') renderStatsSection();
      };
      reader.readAsText(file, 'UTF-8');
    }

    function parseCSV(csvText) {
      const lines = csvText.trim().split('\n');
      
      lines.forEach((line) => {
        if (line.includes('Rang') || line.includes('Équipe') || line.includes('Equipe')) return;
        
        const parts = line.split(',').map(p => p.trim());
        if (parts.length < 7) return;
        
        const teamNameRaw = parts[2];
        const kills = parseInt(parts[3]) || 0;
        const top = parseInt(parts[4]) || 0;
        const total = parseInt(parts[5]) || 0;
        const booyah = parseInt(parts[6]) || 0;

        if (!teamNameRaw) return;

        const teamName = findBestMatch(teamNameRaw);

        if (teamName && teamStats[teamName]) {
          teamStats[teamName].kills += kills;
          teamStats[teamName].top += top;
          teamStats[teamName].total += total;
          teamStats[teamName].booyah += booyah;
        }
      });
    }

    // ========== RENDU TABLEAU GLOBAL ==========

      const teamsTable = document.getElementById('teamsTable');
      teamsTable.innerHTML = '';
      const sortedTeams = [...teamNames].sort((a, b) => teamStats[b].total - teamStats[a].total);

      sortedTeams.forEach((name, index) => {
        const stats = teamStats[name];
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${getTeamLogoHTML(name)} ${name}</td>
          <td><span class="badge-kill">${stats.kills}</span></td>
          <td>${stats.top}</td>
          <td><strong>${stats.total}</strong></td>
          <td>${stats.booyah > 0 ? `<span class="badge-booyah">${stats.booyah}</span>` : '0'}</td>
        `;
        teamsTable.appendChild(row);
      });
    }

      const mvpTable = document.getElementById('mvpTable');
      mvpTable.innerHTML = '';
      const displayList = mvpPlayers.length > 0 ? mvpPlayers : [

          </td>
          <td><span class="badge-kill">${player.kills}</span></td>
          <td>${player.assists}</td>
        `;
        mvpTable.appendChild(row);
      });
    }

    function selectChoice(choice) {
      document.getElementById('welcomeOverlay').style.display = 'none';

    function renderDaySection() {
      currentView = 'day';
      const rightColumn = document.getElementById('rightColumn');

      let weekButtonsHTML = '';
      ['W1', 'W2', 'W3', 'W4', 'SPECIAL'].forEach(week => {
        const label = week === 'SPECIAL' ? 'RUSH / FINAL' : week;
        weekButtonsHTML += `<button class="week-btn ${week === currentWeek ? 'active' : ''}" onclick="changeWeek('${week}')">${label}</button>`;
      });
      weekButtonsHTML += `<button class="week-btn total-btn" onclick="showTotal()"><i class="fas fa-calculator"></i> TOTAL</button>`;

      let dayButtonsHTML = '';
      const days = weeksData[currentWeek].days;
      days.forEach(day => {
        dayButtonsHTML += `<button class="day-btn ${day.id === currentDay ? 'active' : ''}" onclick="changeDay('${day.id}')">${day.id}</button>`;
      });

      const currentDayData = days.find(d => d.id === currentDay) || days[0];
      let dayDisplayHTML = '';
      const isRush = currentDayData.special === 'rush';
      const isFinal = currentDayData.special === 'final';
      const isSpecial = isRush || isFinal;
      const isMiniFinal = currentDayData.isMiniFinal;

      if (isSpecial) {
        const iconClass = isFinal ? 'fa-trophy' : 'fa-bolt';
        const itemClass = isFinal ? 'special' : 'rush';
        dayDisplayHTML = `
          <div class="day-display">
            <div class="day-item ${itemClass}">
              <i class="fas ${iconClass}"></i>
              <div class="day-label">${currentDayData.id}</div>
              <div class="day-match">${currentDayData.match}</div>
              <div class="day-desc">${currentDayData.desc || ''}</div>
            </div>
          </div>`;
      } else if (isMiniFinal) {
        dayDisplayHTML = `
          <div class="day-display">
            <div class="day-item special">
              <i class="fas fa-medal"></i>
              <div class="day-label">${currentDayData.id}</div>
              <div class="day-match">${currentDayData.match}</div>
              <div class="day-desc">${currentDayData.desc || ''}</div>
            </div>
          </div>`;
      } else {
        const teamsCount = currentDayData.groups.reduce((sum, g) => sum + groups[g].length, 0);
        dayDisplayHTML = `
          <div class="day-display">
            <div class="day-item">
              <i class="fas fa-gamepad"></i>
              <div class="day-label">${currentDayData.id}</div>
              <div class="day-match">${currentDayData.match}</div>

      let uploadHTML = '';

              <i class="fas fa-upload"></i> Choisir le CSV
              <input type="file" accept=".csv" onchange="handleFileUpload(event, '${currentDayData.id}')">
            </label>
          </div>
          <div id="uploadStatus" class="upload-status" style="display:none;"></div>
        `;
      }

      let teamsTableHTML = '';
      if (!isSpecial && !isMiniFinal && currentDayData.groups.length > 0) {
        const participatingTeams = [];
        currentDayData.groups.forEach(g => groups[g].forEach(name => participatingTeams.push(name)));
        participatingTeams.sort((a, b) => teamStats[b].total - teamStats[a].total);

        teamsTableHTML = `
          <div class="day-teams-table" id="dayTableCard">
            <div class="table-title">
              <div class="title-left">
                <i class="fas fa-users"></i>
                <span>TEAMS PARTICIPATING (${participatingTeams.length})</span>
              </div>
              <button class="download-btn-small" onclick="downloadImage('dayTableCard', 'SLS10-${currentWeek}-${currentDay}')">
                <i class="fas fa-download"></i> Télécharger
              </button>
            </div>
            <div style="overflow-x: auto;">
              <table>
                <thead>
                  <tr><th>#</th><th>Équipe</th><th>Kills</th><th>Top</th><th>Total</th><th>Booyah</th></tr>
                </thead>
                <tbody>
                  ${participatingTeams.map((name, i) => {
                    const stats = teamStats[name];
                    return `<tr>
                      <td>${i + 1}</td>
                      <td>${getTeamLogoHTML(name)} ${name}</td>
                      <td><span class="badge-kill">${stats.kills}</span></td>
                      <td>${stats.top}</td>
                      <td><strong>${stats.total}</strong></td>
                      <td>${stats.booyah > 0 ? `<span class="badge-booyah">${stats.booyah}</span>` : '0'}</td>

      });
      weekButtonsHTML += `<button class="week-btn total-btn" onclick="showTotal()"><i class="fas fa-calculator"></i> TOTAL</button>`;

        playerStats.forEach(stat => {

                <span class="player-photo">${stat.photo}</span>

    function goBack() {
      document.getElementById('siteContent').classList.remove('active');
      document.getElementById('welcomeOverlay').style.display = 'flex';
      document.getElementById('rightColumn').innerHTML = '';
    }

    renderGlobalTeamsTable();
    renderMVPTable();
  </script>
